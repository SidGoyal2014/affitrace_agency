  -
    name: Endpoints
    description: ''
  -
    name: 'Tracking (Pixel)'
    description: "\nPixel-based conversion tracking endpoints.\nThese endpoints do not require authentication."
  -
    name: 'Tracking (Server-to-Server)'
    description: "\nPublic endpoints for tracking clicks and conversions.\nThese endpoints do not require authentication."
