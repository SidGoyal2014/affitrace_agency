  /api/pixel:
    get:
      summary: 'Fire Conversion Pixel'
      operationId: fireConversionPixel
      description: 'Record a conversion via pixel tracking. Returns a 1x1 transparent GIF.'
      parameters:
        -
          in: query
          name: tid
          description: 'The transaction/click ID.'
          example: abc123xyz
          required: false
          schema:
            type: string
            description: 'The transaction/click ID.'
            example: abc123xyz
        -
          in: query
          name: aff_click_id
          description: 'Alternative parameter for transaction ID.'
          example: abc123xyz
          required: false
          schema:
            type: string
            description: 'Alternative parameter for transaction ID.'
            example: abc123xyz
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: '1x1 transparent GIF image'
        400:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error: 'Missing Transaction ID'
                properties:
                  error:
                    type: string
                    example: 'Missing Transaction ID'
      tags:
        - 'Tracking (Pixel)'
      security: []
  /api/offer/sd:
    get:
      summary: 'Process Postback (S2S Conversion)'
      operationId: processPostbackS2SConversion
      description: 'Server-to-server postback endpoint for recording conversions.'
      parameters:
        -
          in: query
          name: tid
          description: 'The transaction/click ID.'
          example: abc123
          required: false
          schema:
            type: string
            description: 'The transaction/click ID.'
            example: abc123
        -
          in: query
          name: amount
          description: 'Optional payout amount override.'
          example: 10.5
          required: false
          schema:
            type: number
            description: 'Optional payout amount override.'
            example: 10.5
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: 'Y'
                  message: 'Conversion recorded'
                properties:
                  success:
                    type: string
                    example: 'Y'
                  message:
                    type: string
                    example: 'Conversion recorded'
        400:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: 'N'
                  message: 'Invalid transaction ID'
                properties:
                  success:
                    type: string
                    example: 'N'
                  message:
                    type: string
                    example: 'Invalid transaction ID'
      tags:
        - 'Tracking (Server-to-Server)'
      security: []
