openapi: 3.0.3
info:
  title: 'Affitrace API Documentation'
  description: 'RESTful API for Affitrace affiliate tracking platform. Supports Admin, Affiliate, and Advertiser operations.'
  version: 1.0.0
servers:
  -
    url: 'http://82.29.160.75'
paths:
  /api/login:
    post:
      summary: Login
      operationId: login
      description: "Authenticate a user and obtain access and refresh tokens.\nThis endpoint does not require authentication."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Login successful'
                  access_token: 1|abc123...
                  refresh_token: 2|def456...
                  token_type: Bearer
                  user:
                    id: 1
                    name: 'Admin User'
                    email: admin@example.com
                properties:
                  message:
                    type: string
                    example: 'Login successful'
                  access_token:
                    type: string
                    example: 1|abc123...
                  refresh_token:
                    type: string
                    example: 2|def456...
                  token_type:
                    type: string
                    example: Bearer
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Admin User'
                      email:
                        type: string
                        example: admin@example.com
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error: 'Invalid credentials'
                properties:
                  error:
                    type: string
                    example: 'Invalid credentials'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  errors:
                    email:
                      - 'The email field is required.'
                properties:
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The email field is required.'
                        items:
                          type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eai:
                  type: string
                  description: 'The agency/tenant identifier.'
                  example: agency123
                email:
                  type: string
                  description: "The user's email address."
                  example: admin@example.com
                password:
                  type: string
                  description: "The user's password."
                  example: password123
                user_type:
                  type: string
                  description: 'The type of user (admin, affiliate, advertiser).'
                  example: admin
              required:
                - eai
                - email
                - password
                - user_type
      security: []
  /api/logout:
    post:
      summary: Logout
      operationId: logout
      description: 'Revoke the current access token, logging the user out.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Logged out successfully'
                properties:
                  message:
                    type: string
                    example: 'Logged out successfully'
      tags:
        - Authentication
  /api/refresh-token:
    post:
      summary: 'Refresh Token'
      operationId: refreshToken
      description: "Exchange a valid refresh token for a new access/refresh token pair.\nMust be authenticated with the refresh token (not access token)."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Token refreshed successfully'
                  access_token: 3|ghi789...
                  refresh_token: 4|jkl012...
                  token_type: Bearer
                properties:
                  message:
                    type: string
                    example: 'Token refreshed successfully'
                  access_token:
                    type: string
                    example: 3|ghi789...
                  refresh_token:
                    type: string
                    example: 4|jkl012...
                  token_type:
                    type: string
                    example: Bearer
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Invalid token ability. Access tokens cannot be used to refresh.'
                properties:
                  message:
                    type: string
                    example: 'Invalid token ability. Access tokens cannot be used to refresh.'
      tags:
        - Authentication
  /api/me:
    get:
      summary: 'Get Current User'
      operationId: getCurrentUser
      description: "Retrieve the authenticated user's profile information."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 1
                  name: 'Admin User'
                  email: admin@example.com
                  user_type: admin
                  created_at: '2024-01-01T00:00:00.000000Z'
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: 'Admin User'
                  email:
                    type: string
                    example: admin@example.com
                  user_type:
                    type: string
                    example: admin
                  created_at:
                    type: string
                    example: '2024-01-01T00:00:00.000000Z'
      tags:
        - Authentication
