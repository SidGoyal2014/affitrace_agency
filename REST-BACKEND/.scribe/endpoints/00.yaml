    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        status: 200
        content: |-
          {
            "message": "Token refreshed successfully",
            "access_token": "3|ghi789...",
            "refresh_token": "4|jkl012...",
            "token_type": "Bearer"
          }
        headers: []
        description: ''
        custom: []
      -
        status: 403
        content: |-
          {
            "message": "Invalid token ability. Access tokens cannot be used to refresh."
          }
        headers: []
        description: ''
        custom: []
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer P5cevgfba3D6d1Zak8hEV46'
    controller: null
    method: null
    route: null
    custom: []
