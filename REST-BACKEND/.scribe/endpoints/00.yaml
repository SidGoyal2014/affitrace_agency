name: Authentication
description: |-

  Endpoints for user authentication, token management, and profile retrieval.
endpoints:
  -
    httpMethods:
      - POST
    uri: api/login
    metadata:
      groupName: Authentication
      groupDescription: |-

        Endpoints for user authentication, token management, and profile retrieval.
      subgroup: ''
      subgroupDescription: ''
      title: Login
      description: |-
        Authenticate a user and obtain access and refresh tokens.
        This endpoint does not require authentication.
      authenticated: false
      custom: []
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      eai:
        name: eai
        description: 'The agency/tenant identifier.'
        required: true
        example: agency123
        type: string
        enumValues: []
        exampleWasSpecified: true
        custom: []
      email:
        name: email
        description: "The user's email address."
        required: true
        example: admin@example.com
        type: string
        enumValues: []
        exampleWasSpecified: true
        custom: []
      password:
        name: password
        description: "The user's password."
        required: true
        example: password123
        type: string
        enumValues: []
        exampleWasSpecified: true
        custom: []
      user_type:
        name: user_type
        description: 'The type of user (admin, affiliate, advertiser).'
        required: true
        example: admin
        type: string
        enumValues: []
        exampleWasSpecified: true
        custom: []
    cleanBodyParameters:
      eai: agency123
      email: admin@example.com
      password: password123
      user_type: admin
    fileParameters: []
    responses:
      -
        status: 200
        content: |-
          {
            "message": "Login successful",
            "access_token": "1|abc123...",
            "refresh_token": "2|def456...",
            "token_type": "Bearer",
            "user": {"id": 1, "name": "Admin User", "email": "admin@example.com"}
          }
        headers: []
        description: ''
        custom: []
      -
        status: 401
        content: |-
          {
            "error": "Invalid credentials"
          }
        headers: []
        description: ''
        custom: []
      -
        status: 422
        content: |-
          {
            "errors": {"email": ["The email field is required."]}
          }
        headers: []
        description: ''
        custom: []
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
    custom: []
  -
    httpMethods:
      - POST
    uri: api/logout
    metadata:
      groupName: Authentication
      groupDescription: |-

        Endpoints for user authentication, token management, and profile retrieval.
      subgroup: ''
      subgroupDescription: ''
      title: Logout
      description: 'Revoke the current access token, logging the user out.'
      authenticated: true
      custom: []
    headers:
      Authorization: 'Bearer {ACCESS_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        status: 200
        content: |-
          {
            "message": "Logged out successfully"
          }
        headers: []
        description: ''
        custom: []
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer Ekeh61d4a8bVcgP3v65DZfa'
    controller: null
    method: null
    route: null
    custom: []
  -
    httpMethods:
      - POST
    uri: api/refresh-token
    metadata:
      groupName: Authentication
      groupDescription: |-

        Endpoints for user authentication, token management, and profile retrieval.
      subgroup: ''
      subgroupDescription: ''
      title: 'Refresh Token'
      description: |-
        Exchange a valid refresh token for a new access/refresh token pair.
        Must be authenticated with the refresh token (not access token).
      authenticated: true
      custom: []
    headers:
      Authorization: 'Bearer {ACCESS_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
